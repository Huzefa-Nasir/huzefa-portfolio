name: Fix certificate verification link
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-certificate-link.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct certificate ID
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = 'https://freeacademy.ai/verify/FA-2026-AAMZ-FQ9SU6'
          new = 'https://freeacademy.ai/verify/FA-2026-AAMZ-F09SU6'
          if old not in s:
              raise SystemExit('Old certificate URL not found')
          p.write_text(s.replace(old, new))
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix certificate verification link'
          git push