name: Replace About video v2
on:
  push:
    paths:
      - '.github/workflows/replace-about-video-v2.yml'
permissions:
  contents: write
jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download verified video
        run: |
          curl -L --fail 'https://d2ol7oe51mr4n9.cloudfront.net/user_3J73EOxm5WkMkPVtupQKASbbY7h/cfbe9c50-233a-4644-9b1b-3324bbce9d32.mp4' -o about-automation-story.mp4
      - name: Validate asset
        run: |
          test -s about-automation-story.mp4
          SIZE=$(stat -c%s about-automation-story.mp4)
          echo "video bytes: $SIZE"
          test "$SIZE" -gt 1000000
      - name: Commit replacement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add about-automation-story.mp4
          git commit -m 'Replace black About film with rendered automation ad'
          git push
