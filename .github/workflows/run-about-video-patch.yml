name: Run About video patch
on:
  push:
    paths:
      - '.github/workflows/run-about-video-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download video asset
        run: curl -L --fail 'https://d2ol7oe51mr4n9.cloudfront.net/user_3J73EOxm5WkMkPVtupQKASbbY7h/2e127a0b-2214-424d-b026-0c940b3c6301.mp4' -o about-automation-story.mp4
      - name: Patch page
        run: python patch_about_video.py
      - name: Validate
        run: |
          test -s about-automation-story.mp4
          grep -q 'id="aboutFilm"' index.html
          grep -q 'muted loop playsinline autoplay' index.html
          grep -q "markReveal('#about .about-film-shell','reveal-scale');" index.html
          grep -q 'Premium About motion film' index.html
          grep -q 'about-film-fallback' index.html
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          Path('/tmp/site.js').write_text('\n'.join(re.findall(r'<script>(.*?)</script>',s,re.S)))
          PY
          node --check /tmp/site.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html about-automation-story.mp4
          git commit -m 'Harden About story video autoplay and reveal'
          git push
