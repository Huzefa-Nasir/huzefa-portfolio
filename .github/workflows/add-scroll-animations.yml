name: Add scroll animations

on:
  push:
    paths:
      - '.github/workflows/add-scroll-animations.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run scroll animation upgrade'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add tasteful scroll animations
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          css='''
/* Scroll reveal system */
.reveal{opacity:0;transform:translateY(34px);transition:opacity .75s cubic-bezier(.2,.7,.2,1),transform .75s cubic-bezier(.2,.7,.2,1);will-change:opacity,transform}.reveal.in{opacity:1;transform:none}.reveal-left{opacity:0;transform:translateX(-34px);transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .8s cubic-bezier(.2,.7,.2,1);will-change:opacity,transform}.reveal-left.in{opacity:1;transform:none}.reveal-right{opacity:0;transform:translateX(34px);transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .8s cubic-bezier(.2,.7,.2,1);will-change:opacity,transform}.reveal-right.in{opacity:1;transform:none}.reveal-scale{opacity:0;transform:translateY(24px) scale(.975);transition:opacity .85s cubic-bezier(.2,.7,.2,1),transform .85s cubic-bezier(.2,.7,.2,1);will-change:opacity,transform}.reveal-scale.in{opacity:1;transform:none}.reveal[data-delay="1"],.reveal-left[data-delay="1"],.reveal-right[data-delay="1"],.reveal-scale[data-delay="1"]{transition-delay:.08s}.reveal[data-delay="2"],.reveal-left[data-delay="2"],.reveal-right[data-delay="2"],.reveal-scale[data-delay="2"]{transition-delay:.16s}.reveal[data-delay="3"],.reveal-left[data-delay="3"],.reveal-right[data-delay="3"],.reveal-scale[data-delay="3"]{transition-delay:.24s}.reveal[data-delay="4"],.reveal-left[data-delay="4"],.reveal-right[data-delay="4"],.reveal-scale[data-delay="4"]{transition-delay:.32s}
'''
          marker='@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}.success{opacity:1}}'
          replacement='@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}.success{opacity:1}.reveal,.reveal-left,.reveal-right,.reveal-scale{opacity:1!important;transform:none!important;transition:none!important}}'
          if marker not in s:
              raise SystemExit('reduced-motion marker not found')
          s=s.replace(marker,css+replacement,1)
          js='''
// Scroll reveals: restrained, one-time motion that keeps the site feeling alive without fighting the hero demo.
const revealTargets=[];
function markReveal(selector,cls='reveal',stagger=false){document.querySelectorAll(selector).forEach((el,i)=>{el.classList.add(cls);if(stagger)el.dataset.delay=String((i%4)+1);revealTargets.push(el)})}
markReveal('#work .head > div','reveal-left');
markReveal('#work .head > p','reveal-right');
markReveal('#work .case','reveal-scale');
markReveal('#integrations .head > div','reveal-left');
markReveal('#integrations .head > p','reveal-right');
markReveal('#integrations .logo-marquee','reveal');
markReveal('#integrations .note','reveal');
markReveal('#process .head','reveal');
markReveal('#process .step','reveal-scale',true);
markReveal('#about .about > div:first-child','reveal-left');
markReveal('#about .mini > div','reveal-scale',true);
markReveal('section > .wrap > .cta','reveal-scale');
markReveal('footer > div','reveal',true);
if('IntersectionObserver' in window){const io=new IntersectionObserver(entries=>{entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.add('in');io.unobserve(entry.target)}})},{threshold:.14,rootMargin:'0px 0px -8% 0px'});revealTargets.forEach(el=>io.observe(el))}else{revealTargets.forEach(el=>el.classList.add('in'))}
'''
          end='</script></body></html>'
          if end not in s:
              raise SystemExit('script end marker not found')
          s=s.replace(end,js+end,1)
          p.write_text(s)
          PY
      - name: Commit portfolio update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add subtle scroll reveal animations"
          git push
