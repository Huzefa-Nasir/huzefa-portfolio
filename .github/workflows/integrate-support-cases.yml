name: Integrate support case studies

on:
  push:
    paths:
      - '.github/workflows/integrate-support-cases.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run support case integration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Upgrade supporting case studies
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old_css=".support{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}"
          new_css=".support{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.support-card{padding:0;overflow:hidden;display:flex;flex-direction:column}.support-copy{padding:23px 23px 18px;flex:1}.support-card h3{font-size:21px;margin:10px 0}.support-card p{font-size:13px;line-height:1.55}.support-shot{height:185px;margin:0 12px 12px;background:#101012}.support-shot img{width:100%;height:100%;object-fit:cover;object-position:center}.support-shot:after{content:'Open full workflow ↗';font-size:10px;right:10px;bottom:10px;padding:6px 9px}.support-card:hover{border-color:#413a40}.support-card:hover .support-shot img{filter:brightness(1.08)}"
          if old_css not in s:
              raise SystemExit('support CSS marker not found')
          s=s.replace(old_css,new_css,1)
          old_html='<div class="support"><article class="case"><div class="label">Zapier · AI Voice</div><h3>Automated outbound calling pipeline</h3><p>Google Sheets leads are formatted, authenticated, looped and sent to a third-party AI voice service.</p></article><article class="case"><div class="label">Email Parser · Azure AI · Postmark</div><h3>Unstructured email into structured operations</h3><p>Forwarded emails are parsed, processed with code and Azure AI, filtered and rebuilt as structured messages.</p></article><article class="case"><div class="label">HubSpot · API · Python</div><h3>Create-or-update CRM synchronization</h3><p>Webhook data is processed, matched against HubSpot and routed into create or update paths.</p></article></div>'
          new_html='<div class="support"><article class="case support-card"><div class="support-copy"><div class="label">03 · Zapier · AI Voice</div><h3>From spreadsheet lead to automated outbound call</h3><p>Google Sheets leads move through formatting, authentication and looped processing before being handed to an AI voice platform for outbound calling.</p><div class="flow"><span>Sheets</span><b>→</b><span>Format</span><b>→</b><span>Loop</span><b>→</b><span>AI call</span></div></div><div class="workflow-shot support-shot" data-full="Vocie-Ai-zap.png"><img src="Vocie-Ai-zap.png" alt="Zapier AI voice outbound calling workflow"></div></article><article class="case support-card"><div class="support-copy"><div class="label">04 · Email Parser · Azure AI · Postmark</div><h3>Turning messy inbox data into structured operations</h3><p>Forwarded emails are parsed, transformed with custom code and Azure AI, filtered, then rebuilt into structured messages for downstream follow-up.</p><div class="flow"><span>Email</span><b>→</b><span>Parse</span><b>→</b><span>AI</span><b>→</b><span>Postmark</span></div></div><div class="workflow-shot support-shot" data-full="emailparser.png"><img src="emailparser.png" alt="Email Parser Azure AI and Postmark workflow"></div></article><article class="case support-card"><div class="support-copy"><div class="label">05 · HubSpot · API · Python</div><h3>Search first. Then create or update the CRM record.</h3><p>Incoming webhook data is processed and matched against HubSpot so the automation can intelligently create a new record or update the one that already exists.</p><div class="flow"><span>Webhook</span><b>→</b><span>Process</span><b>→</b><span>Search</span><b>→</b><span>Create / update</span></div></div><div class="workflow-shot support-shot" data-full="hubspot-webflow.png"><img src="hubspot-webflow.png" alt="HubSpot API and Python create or update workflow"></div></article></div>'
          if old_html not in s:
              raise SystemExit('support HTML marker not found')
          s=s.replace(old_html,new_html,1)
          s=s.replace('.support,.process{grid-template-columns:1fr 1fr}', '.support,.process{grid-template-columns:1fr 1fr}',1)
          s=s.replace('.proof,.support,.process,.mini,.fields{grid-template-columns:1fr}', '.proof,.support,.process,.mini,.fields{grid-template-columns:1fr}.support-shot{height:210px}',1)
          p.write_text(s)
          PY
      - name: Commit portfolio update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add real screenshots to supporting case studies"
          git push
