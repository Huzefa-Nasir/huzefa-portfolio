name: Run About card layout fix
on:
  push:
    paths:
      - '.github/workflows/run-about-card-layout-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 patch_about_card_layout.py
      - name: Validate
        run: |
          grep -q 'About card layout repair' index.html
          grep -q 'grid-template-columns:repeat(3,minmax(0,1fr))' index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix About integration card layouts'
          git push
