name: Review scroll animations

on:
  push:
    paths:
      - '.github/workflows/review-scroll-animations.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run scroll animation review'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tune reveal motion
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          start=s.index('/* Scroll reveal system */')
          end=s.index('</style>', start)
          reviewed="""/* Scroll reveal system — reviewed */.reveal{opacity:0;transform:translateY(22px);transition:opacity .62s cubic-bezier(.2,.7,.2,1),transform .62s cubic-bezier(.2,.7,.2,1);will-change:opacity,transform}.reveal.in{opacity:1;transform:none;will-change:auto}.reveal-left{opacity:0;transform:translate3d(-24px,8px,0);transition:opacity .68s cubic-bezier(.2,.7,.2,1),transform .68s cubic-bezier(.2,.7,.2,1);will-change:opacity,transform}.reveal-left.in{opacity:1;transform:none;will-change:auto}.reveal-right{opacity:0;transform:translate3d(24px,8px,0);transition:opacity .68s cubic-bezier(.2,.7,.2,1),transform .68s cubic-bezier(.2,.7,.2,1);will-change:opacity,transform}.reveal-right.in{opacity:1;transform:none;will-change:auto}.reveal-scale{opacity:0;transform:translateY(18px) scale(.992);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1);will-change:opacity,transform}.reveal-scale.in{opacity:1;transform:none;will-change:auto}.reveal[data-delay='1'],.reveal-left[data-delay='1'],.reveal-right[data-delay='1'],.reveal-scale[data-delay='1']{transition-delay:.05s}.reveal[data-delay='2'],.reveal-left[data-delay='2'],.reveal-right[data-delay='2'],.reveal-scale[data-delay='2']{transition-delay:.1s}.reveal[data-delay='3'],.reveal-left[data-delay='3'],.reveal-right[data-delay='3'],.reveal-scale[data-delay='3']{transition-delay:.15s}.reveal[data-delay='4'],.reveal-left[data-delay='4'],.reveal-right[data-delay='4'],.reveal-scale[data-delay='4']{transition-delay:.2s}@media(max-width:550px){.reveal,.reveal-left,.reveal-right,.reveal-scale{transform:translateY(14px) scale(.997);transition-duration:.5s}.reveal[data-delay='1'],.reveal-left[data-delay='1'],.reveal-right[data-delay='1'],.reveal-scale[data-delay='1']{transition-delay:.03s}.reveal[data-delay='2'],.reveal-left[data-delay='2'],.reveal-right[data-delay='2'],.reveal-scale[data-delay='2']{transition-delay:.06s}.reveal[data-delay='3'],.reveal-left[data-delay='3'],.reveal-right[data-delay='3'],.reveal-scale[data-delay='3']{transition-delay:.09s}.reveal[data-delay='4'],.reveal-left[data-delay='4'],.reveal-right[data-delay='4'],.reveal-scale[data-delay='4']{transition-delay:.12s}}@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}.success{opacity:1}.reveal,.reveal-left,.reveal-right,.reveal-scale{opacity:1!important;transform:none!important;transition:none!important}}"""
          s=s[:start]+reviewed+s[end:]
          s=s.replace("markReveal('#work .case','reveal-scale');", "markReveal('#work .case','reveal-scale',true);",1)
          s=s.replace("},{threshold:.14,rootMargin:'0px 0px -8% 0px'});", "},{threshold:.1,rootMargin:'0px 0px -4% 0px'});",1)
          p.write_text(s)
          PY
      - name: Commit animation review
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refine scroll animation timing and mobile motion"
          git push

# trigger 2
