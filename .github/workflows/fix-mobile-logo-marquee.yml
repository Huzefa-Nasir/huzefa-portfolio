name: Fix mobile logo marquee

on:
  push:
    paths:
      - '.github/workflows/fix-mobile-logo-marquee.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run mobile logo marquee fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prevent touch taps from pausing marquee
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='.logo-track:hover{animation-play-state:paused}'
          new='@media(hover:hover) and (pointer:fine){.logo-track:hover{animation-play-state:paused}}'
          if old not in s:
              raise SystemExit('logo hover marker not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit marquee fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Keep integration marquee moving on touch devices"
          git push
