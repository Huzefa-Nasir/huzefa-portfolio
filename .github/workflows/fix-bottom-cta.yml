name: Fix bottom CTA layout

on:
  push:
    paths:
      - '.github/workflows/fix-bottom-cta.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run bottom CTA layout fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refine final CTA composition
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old=".cta{padding:50px;border-radius:24px;background:linear-gradient(135deg,#ff4f00,#ff7139);display:flex;justify-content:space-between;align-items:center}.cta h2{font:700 48px/1 'Space Grotesk';margin:8px 0}.cta .btn{background:#0b0b0c;color:white}"
          new=".cta{padding:50px;border-radius:24px;background:linear-gradient(135deg,#ff4f00,#ff7139);display:block;position:relative;overflow:hidden}.cta:after{content:'';position:absolute;width:250px;height:250px;border-radius:50%;right:-90px;top:-110px;background:#ffffff0c;pointer-events:none}.cta>div{position:relative;z-index:1}.cta h2{font:700 48px/1 'Space Grotesk';margin:8px 0;max-width:980px}.cta p{max-width:760px;margin:14px 0 0}.cta>.btn{position:relative;z-index:1;background:#0b0b0c;color:white;margin-top:28px;padding:15px 21px;box-shadow:0 12px 28px #40160035;transition:.2s}.cta>.btn:hover{transform:translateY(-2px);box-shadow:0 18px 34px #40160045}"
          if old not in s:
              raise SystemExit('CTA CSS marker not found')
          s=s.replace(old,new,1)
          s=s.replace('.head,.cta,footer{flex-direction:column;align-items:flex-start}', '.head,footer{flex-direction:column;align-items:flex-start}',1)
          s=s.replace('.cta h2{font-size:36px}', '.cta{padding:34px 26px}.cta h2{font-size:36px}.cta>.btn{width:100%;justify-content:center;margin-top:22px}',1)
          p.write_text(s)
          PY
      - name: Commit CTA fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix bottom CTA composition"
          git push

# trigger