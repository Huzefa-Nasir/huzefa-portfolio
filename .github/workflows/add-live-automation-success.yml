name: Add live automation success experience

on:
  push:
    paths:
      - '.github/workflows/add-live-automation-success.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add responsive animated post-submit experience
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text()

          css = r'''/* Live post-submit automation experience */
          .automation-mode>.fields,.automation-mode>.form-actions{display:none!important}
          .automation-live.sent{display:none;margin:4px 0 0;padding:0;border:0;background:transparent}
          .automation-live.sent.show{display:block;animation:autoEnter .45s cubic-bezier(.2,.75,.2,1) both}
          .auto-live-wrap{position:relative;overflow:hidden;border:1px solid #353039;border-radius:22px;padding:28px;background:radial-gradient(circle at 50% -20%,#ff4f001b,transparent 37%),linear-gradient(145deg,#131216,#0b0b0d);box-shadow:0 22px 70px #0006}
          .auto-live-wrap:before{content:'';position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(#ffffff06 1px,transparent 1px),linear-gradient(90deg,#ffffff06 1px,transparent 1px);background-size:30px 30px;mask-image:linear-gradient(to bottom,#0008,transparent 72%)}
          .auto-live-wrap>*{position:relative;z-index:1}
          .auto-live-head{text-align:center;max-width:760px;margin:0 auto 24px}
          .auto-live-badge{display:inline-flex;align-items:center;gap:8px;padding:7px 11px;border:1px solid #ff6c353f;border-radius:999px;background:#ff4f000c;color:#ff9a70;font:700 10px 'Space Grotesk';letter-spacing:.12em;text-transform:uppercase}
          .auto-live-badge i{width:8px;height:8px;border-radius:50%;background:var(--o);box-shadow:0 0 0 0 #ff4f0066;animation:autoPulse 1.35s infinite}
          .auto-live-head h2{font:700 clamp(30px,4vw,44px)/1 'Space Grotesk';letter-spacing:-.045em;margin:15px 0 9px}
          .auto-live-head h2 em{font-style:normal;color:var(--o)}
          .auto-live-head p{margin:0;color:var(--muted);font-size:14px}
          .auto-route{--auto-progress:0%;position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin:26px 0 16px}
          .auto-route:before,.auto-route:after{content:'';position:absolute;left:7%;right:7%;top:23px;height:2px;border-radius:999px;z-index:0}
          .auto-route:before{background:#332e34}
          .auto-route:after{right:auto;width:calc(var(--auto-progress)*.86);background:linear-gradient(90deg,#ff4f00,#9b6dff,#42d3b1,#b9ff66);box-shadow:0 0 14px #ff4f0038;transition:width .65s cubic-bezier(.2,.7,.2,1)}
          .auto-stage{--stage:#7f777b;position:relative;z-index:1;min-width:0;padding:0 0 14px;border:1px solid #302b31;border-radius:16px;background:#0d0c0f;overflow:hidden;transition:border-color .35s,transform .35s,box-shadow .35s,opacity .35s;opacity:.55}
          .auto-stage:nth-child(1){--stage:#ff6540}.auto-stage:nth-child(2){--stage:#8f72ff}.auto-stage:nth-child(3){--stage:#31cfa4}.auto-stage:nth-child(4){--stage:#b9ff66}
          .auto-stage.running{opacity:1;transform:translateY(-4px);border-color:color-mix(in srgb,var(--stage) 70%,#302b31);box-shadow:0 14px 32px #0005,0 0 0 1px color-mix(in srgb,var(--stage) 20%,transparent)}
          .auto-stage.done{opacity:1;border-color:#b9ff6640}
          .auto-stage-top{height:46px;display:flex;align-items:center;padding:0 13px;border-bottom:1px solid #ffffff08;background:#ffffff02}
          .auto-step-dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#161419;border:1px solid #4a444b;color:#8e878b;font:700 10px 'Space Grotesk';transition:.35s}
          .auto-stage.running .auto-step-dot{background:color-mix(in srgb,var(--stage) 17%,#111);border-color:var(--stage);color:white;box-shadow:0 0 18px color-mix(in srgb,var(--stage) 40%,transparent)}
          .auto-stage.done .auto-step-dot{background:var(--g);border-color:var(--g);color:#17200e}
          .auto-stage.done .auto-step-num{display:none}.auto-step-check{display:none}.auto-stage.done .auto-step-check{display:inline}
          .auto-stage-body{padding:13px 13px 0}
          .auto-stage-body b{display:block;font:700 13px 'Space Grotesk';margin-bottom:4px}
          .auto-stage-body span{display:block;color:#8f8885;font-size:10px;line-height:1.4;min-height:29px}
          .auto-stage-state{display:flex;align-items:center;gap:6px;margin-top:10px;color:#6f6967;font-size:9px;text-transform:uppercase;letter-spacing:.07em;font-weight:700}
          .auto-stage-state:before{content:'';width:6px;height:6px;border-radius:50%;background:#514b50}
          .auto-stage.running .auto-stage-state{color:var(--stage)}.auto-stage.running .auto-stage-state:before{background:var(--stage);animation:autoBlink .72s infinite}
          .auto-stage.done .auto-stage-state{color:var(--g)}.auto-stage.done .auto-stage-state:before{background:var(--g)}
          .auto-terminal{display:flex;align-items:center;gap:10px;min-height:46px;padding:11px 14px;border:1px solid #2e2930;border-radius:12px;background:#08080a;color:#aaa3a0;font:500 11px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;overflow:hidden}
          .auto-terminal-lights{display:flex;gap:4px;flex:0 0 auto}.auto-terminal-lights i{width:6px;height:6px;border-radius:50%;background:#3f393f}.auto-terminal-lights i:first-child{background:#ff6540}.auto-terminal-lights i:nth-child(2){background:#ffca58}.auto-terminal-lights i:nth-child(3){background:#b9ff66}
          .auto-terminal code{white-space:normal;overflow-wrap:anywhere;color:#b8b0ad}.auto-terminal strong{color:white;font-weight:600}
          .auto-spam{margin-top:14px;display:flex;align-items:center;gap:13px;padding:16px;border:1px solid #ff724241;border-radius:14px;background:linear-gradient(90deg,#ff4f0012,#ff4f0006);transform:translateY(5px);opacity:.72;transition:.45s}
          .auto-spam.hot{opacity:1;transform:none;border-color:#ff724280;box-shadow:0 12px 34px #ff4f0013;animation:autoSpamGlow 1.8s ease-in-out 2}
          .auto-spam-icon{width:40px;height:40px;flex:0 0 40px;border-radius:11px;display:grid;place-items:center;background:#ff4f0015;border:1px solid #ff724246;color:#ff8c61;font-size:20px}
          .auto-spam b{display:block;font:700 13px 'Space Grotesk';color:#fff}.auto-spam b em{font-style:normal;color:#ff8b61}.auto-spam span{display:block;color:#aaa3a0;font-size:10px;margin-top:2px}
          .auto-live-actions{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;margin-top:18px}
          .auto-live-actions .btn{min-height:43px}.auto-live-note{text-align:center;margin-top:10px;color:#696361;font-size:9px;line-height:1.45}
          @keyframes autoEnter{from{opacity:0;transform:translateY(12px) scale(.99)}}@keyframes autoPulse{70%{box-shadow:0 0 0 8px transparent}}@keyframes autoBlink{50%{opacity:.28}}@keyframes autoSpamGlow{50%{box-shadow:0 0 0 3px #ff4f0012,0 16px 38px #ff4f001d}}
          @media(max-width:820px){.auto-live-wrap{padding:23px}.auto-route{grid-template-columns:1fr 1fr}.auto-route:before,.auto-route:after{display:none}.auto-stage-body span{min-height:auto}.auto-stage{min-height:135px}}
          @media(max-width:550px){.auto-live-wrap{padding:18px 14px;border-radius:18px}.auto-live-head{margin-bottom:18px}.auto-live-head h2{font-size:29px}.auto-live-head p{font-size:12px}.auto-route{grid-template-columns:1fr;gap:8px;margin:18px 0 12px}.auto-stage{min-height:0;display:grid;grid-template-columns:46px 1fr;padding:0;overflow:visible}.auto-stage.running{transform:none}.auto-stage-top{height:100%;min-height:84px;padding:0;justify-content:center;border:0;border-right:1px solid #ffffff08;border-radius:15px 0 0 15px}.auto-stage-body{padding:12px 12px 11px}.auto-stage-body b{font-size:12px}.auto-stage-body span{font-size:10px}.auto-stage-state{margin-top:7px}.auto-terminal{font-size:10px;align-items:flex-start}.auto-terminal-lights{margin-top:5px}.auto-spam{align-items:flex-start;padding:14px 12px}.auto-spam-icon{width:36px;height:36px;flex-basis:36px}.auto-spam b{font-size:12px}.auto-live-actions{display:grid;grid-template-columns:1fr}.auto-live-actions .btn{width:100%}.auto-live-note{font-size:8px}.shell{scrollbar-gutter:auto}}
          @media(prefers-reduced-motion:reduce){.automation-live.sent.show,.auto-live-badge i,.auto-stage.running .auto-stage-state:before,.auto-spam.hot{animation:none!important}.auto-route:after,.auto-stage,.auto-spam{transition:none!important}}
          '''

          if '/* Live post-submit automation experience */' not in s:
              if '</style>' not in s:
                  raise SystemExit('style closing tag not found')
              s = s.replace('</style>', css + '</style>', 1)

          success_html = r'''<div class="sent automation-live" id="sent" role="status" aria-live="polite" tabindex="-1"><div class="auto-live-wrap"><div class="auto-live-head"><div class="auto-live-badge"><i></i> Live automation handoff</div><h2>You didn't just send a form. You <em>triggered a workflow.</em></h2><p>Watch what happens after your project brief leaves this page.</p></div><div class="auto-route" id="autoRoute"><div class="auto-stage" data-auto-stage="0"><div class="auto-stage-top"><div class="auto-step-dot"><span class="auto-step-num">01</span><span class="auto-step-check">✓</span></div></div><div class="auto-stage-body"><b>Webhook captured</b><span>Your project data has been handed to the automation.</span><div class="auto-stage-state">Waiting</div></div></div><div class="auto-stage" data-auto-stage="1"><div class="auto-stage-top"><div class="auto-step-dot"><span class="auto-step-num">02</span><span class="auto-step-check">✓</span></div></div><div class="auto-stage-body"><b>AI understanding</b><span>AI is reading your request, apps and process context.</span><div class="auto-stage-state">Queued</div></div></div><div class="auto-stage" data-auto-stage="2"><div class="auto-stage-top"><div class="auto-step-dot"><span class="auto-step-num">03</span><span class="auto-step-check">✓</span></div></div><div class="auto-stage-body"><b>Reply drafting</b><span>Your automated reply is being prepared from the brief.</span><div class="auto-stage-state">Queued</div></div></div><div class="auto-stage" data-auto-stage="3"><div class="auto-stage-top"><div class="auto-step-dot"><span class="auto-step-num">04</span><span class="auto-step-check">✓</span></div></div><div class="auto-stage-body"><b>Email handoff</b><span>The reply workflow is sending to <strong id="autoEmailTarget">your email</strong>.</span><div class="auto-stage-state">Queued</div></div></div></div><div class="auto-terminal" aria-live="polite"><span class="auto-terminal-lights"><i></i><i></i><i></i></span><code id="autoLog"><strong>Ready.</strong> Waiting for the automation handoff…</code></div><div class="auto-spam" id="autoSpam"><div class="auto-spam-icon">✉</div><div><b>Open your inbox — and <em>check Spam / Junk too.</em></b><span>Automated replies can land there. Don't miss the email while the workflow finishes.</span></div></div><div class="auto-live-actions"><button class="btn primary" type="button" id="autoDone">Got it — I'll check my inbox ↗</button></div><div class="auto-live-note">This live view mirrors the workflow after the webhook handoff. Email delivery can take a moment depending on the mail provider.</div></div></div>'''

          pattern = r'<div class="sent" id="sent">.*?</div></form>'
          if not re.search(pattern, s, re.S):
              if 'class="sent automation-live" id="sent"' not in s:
                  raise SystemExit('existing success block not found')
          else:
              s = re.sub(pattern, success_html + '</form>', s, count=1, flags=re.S)

          functions = r'''function resetAutomationExperience(){const route=document.getElementById('autoRoute'),spam=document.getElementById('autoSpam'),head=document.querySelector('.brief-head');if(!formEl||!sentEl)return;formEl.classList.remove('automation-mode');sentEl.classList.remove('show');if(head)head.style.display='';if(backBtn)backBtn.style.display='';if(route){route.style.setProperty('--auto-progress','0%');route.querySelectorAll('.auto-stage').forEach((el,i)=>{el.classList.remove('running','done');const state=el.querySelector('.auto-stage-state');if(state)state.textContent=i===0?'Waiting':'Queued'})}if(spam)spam.classList.remove('hot');if(sendBtn){sendBtn.disabled=false;sendBtn.textContent='Send my process ↗'}}function launchAutomationExperience(email){const route=document.getElementById('autoRoute'),stages=route?[...route.querySelectorAll('.auto-stage')]:[],log=document.getElementById('autoLog'),spam=document.getElementById('autoSpam'),target=document.getElementById('autoEmailTarget'),done=document.getElementById('autoDone'),head=document.querySelector('.brief-head');formEl.classList.add('automation-mode');if(head)head.style.display='none';if(backBtn)backBtn.style.display='none';if(target)target.textContent=email||'your email';sentEl.classList.add('show');sentEl.focus({preventScroll:true});sentEl.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});const messages=[['Webhook captured','POST → project brief accepted by the webhook.'],['AI processing','AI → reading your process, apps and project intent.'],['Drafting reply','AI → preparing a personalized email response.'],['Email handoff','Email → automated reply workflow dispatched.']];const delays=[120,1150,3000,5000];stages.forEach((stage,i)=>{setTimeout(()=>{stages.forEach((x,j)=>{if(j<i){x.classList.remove('running');x.classList.add('done');const st=x.querySelector('.auto-stage-state');if(st)st.textContent='Complete'}});stage.classList.add('running');const state=stage.querySelector('.auto-stage-state');if(state)state.textContent=i===3?'Sending':'Running';if(route)route.style.setProperty('--auto-progress',`${i*33}%`);if(log)log.innerHTML=`<strong>${messages[i][0]}.</strong> ${messages[i][1]}`},delays[i])});setTimeout(()=>{stages.forEach(x=>{x.classList.remove('running');x.classList.add('done');const st=x.querySelector('.auto-stage-state');if(st)st.textContent='Complete'});if(route)route.style.setProperty('--auto-progress','100%');if(log)log.innerHTML='<strong>Workflow is in motion.</strong> Your automated reply should arrive shortly.';if(spam)spam.classList.add('hot')},6800);if(done&&!done.dataset.bound){done.dataset.bound='1';done.addEventListener('click',closeContact)}}'''

          submit_marker = "formEl.addEventListener('submit',async e=>{"
          if 'function launchAutomationExperience(email)' not in s:
              if submit_marker not in s:
                  raise SystemExit('submit handler marker not found')
              s = s.replace(submit_marker, functions + submit_marker, 1)

          # Replace the old tiny success-state behavior with the live experience.
          s, count = re.subn(r"sentEl\.classList\.add\('show'\);sendBtn\.textContent='[^']*'", "launchAutomationExperience(emailInput.value)", s, count=1)
          if count == 0 and 'launchAutomationExperience(emailInput.value)' not in s:
              raise SystemExit('submit success behavior not found')

          # Reset the animated experience whenever the contact modal is closed.
          old_close = "briefEl.classList.remove('open');choicesEl.style.display='block';if(lastFocus)lastFocus.focus()"
          new_close = "briefEl.classList.remove('open');resetAutomationExperience();choicesEl.style.display='block';if(lastFocus)lastFocus.focus()"
          if old_close in s:
              s = s.replace(old_close, new_close, 1)
          elif 'resetAutomationExperience();choicesEl.style.display' not in s:
              raise SystemExit('closeContact reset marker not found')

          # A little more bottom breathing room in the form on all viewport sizes.
          if '.brief.open{display:block;padding-bottom:12px}' not in s:
              s = s.replace('.brief.open{display:block;padding-bottom:4px}', '.brief.open{display:block;padding-bottom:12px}', 1)

          p.write_text(s)
          PY

      - name: Static safety checks
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          s=Path('index.html').read_text()
          checks=[
            'class="sent automation-live" id="sent"',
            'id="autoRoute"',
            'id="autoSpam"',
            'function launchAutomationExperience(email)',
            'launchAutomationExperience(emailInput.value)',
            'resetAutomationExperience();choicesEl.style.display',
            '@media(max-width:550px)',
            'check Spam / Junk too',
            'This live view mirrors the workflow after the webhook handoff.'
          ]
          missing=[x for x in checks if x not in s]
          if missing:
            print('Missing expected markers:',missing)
            sys.exit(1)
          if s.count('id="sent"') != 1:
            print('Unexpected sent id count:',s.count('id="sent"'))
            sys.exit(1)
          print('Animated success experience checks passed.')
          PY

      - name: Commit live automation experience
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add animated post-submit automation experience"
          git push
