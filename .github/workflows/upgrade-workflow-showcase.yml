name: Upgrade advanced workflow showcase

on:
  push:
    paths:
      - '.github/workflows/upgrade-workflow-showcase.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace unreadable screenshots with architecture previews
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text()

          css = r'''/* Interactive architecture previews for advanced case studies */
          .arch-preview{position:relative;display:block;margin:0 16px 16px;min-height:280px;border:1px solid #383239;border-radius:16px;overflow:hidden;background:radial-gradient(circle at 50% 5%,#ff4f0011,transparent 34%),linear-gradient(#ffffff06 1px,transparent 1px),linear-gradient(90deg,#ffffff06 1px,transparent 1px),#0d0c0f;background-size:auto,30px 30px,30px 30px,auto;box-shadow:inset 0 1px #ffffff05;transition:.22s}
          .arch-preview:hover{border-color:#ff4f0068;transform:translateY(-2px);box-shadow:0 18px 45px #0007,inset 0 1px #ffffff08}.arch-preview:focus-visible{outline:3px solid var(--g);outline-offset:3px}
          .arch-preview-head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 16px;border-bottom:1px solid #ffffff0c;background:#111013d9;position:relative;z-index:2}.arch-preview-head span{font:700 9px 'Space Grotesk';letter-spacing:.13em;color:var(--o);text-transform:uppercase}.arch-preview-head b{font:600 10px 'Space Grotesk';color:#9b9491;text-align:right}
          .arch-preview svg{display:block;width:100%;height:210px;position:relative;z-index:1}.arch-preview .wire{fill:none;stroke:#ff4f00;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;opacity:.66;filter:drop-shadow(0 0 3px #ff4f003d)}.arch-preview .wire.faint{opacity:.26;stroke-dasharray:6 6}.arch-preview .box{fill:#17151a;stroke:#4a434b;stroke-width:1.4}.arch-preview .box.hot{stroke:#ff6831;filter:drop-shadow(0 0 6px #ff4f004d)}.arch-preview .box.ai{stroke:#31b994}.arch-preview .box.data{stroke:#4b83f1}.arch-preview .box.path{stroke:#b07bff}.arch-preview .box.done{stroke:#7ccf46}.arch-preview .dot-node{fill:#17151a;stroke:#ff6831;stroke-width:2}.arch-preview .beacon{fill:#ff4f00;filter:drop-shadow(0 0 7px #ff4f00);animation:archPulse 1.8s ease-in-out infinite}.arch-preview text{font-family:'Space Grotesk',sans-serif;fill:#958e8b;font-size:10px;font-weight:600}.arch-preview .stage-label{fill:#6c6664;font-size:8px;letter-spacing:1.1px}.arch-preview-foot{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 16px 14px;border-top:1px solid #ffffff0b;background:#0c0b0eeb;position:relative;z-index:2}.arch-preview-foot span{color:#8e8784;font-size:10px}.arch-preview-foot b{color:#fff;font:700 11px 'Space Grotesk';white-space:nowrap}.arch-preview:hover .arch-preview-foot b{color:#ff8a5c}
          .arch-zapier{margin:16px;min-height:390px;align-self:stretch}.arch-zapier svg{height:310px}.case-duo .arch-zapier{display:flex;flex-direction:column;justify-content:space-between}.case-duo .arch-zapier svg{flex:1;min-height:270px}.case-duo .explorer-cta-wrap{margin-top:20px}
          @keyframes archPulse{0%,100%{opacity:.35;transform:scale(.82);transform-origin:center}50%{opacity:1;transform:scale(1.28);transform-origin:center}}
          @media(max-width:850px){.arch-zapier{min-height:320px}.arch-zapier svg{height:250px}.case-duo .arch-zapier svg{min-height:235px}}
          @media(max-width:550px){.arch-preview{margin:0 10px 10px;min-height:238px;border-radius:14px}.arch-preview-head{padding:11px 12px;align-items:flex-start}.arch-preview-head b{font-size:9px}.arch-preview svg{height:172px}.arch-preview-foot{padding:10px 12px 12px;align-items:flex-start;flex-direction:column;gap:4px}.arch-preview-foot b{font-size:10px}.arch-zapier{margin:10px;min-height:290px}.arch-zapier svg{height:205px}.case-duo .arch-zapier svg{min-height:205px}}
          @media(prefers-reduced-motion:reduce){.arch-preview .beacon{animation:none!important}}
          '''

          if '/* Interactive architecture previews for advanced case studies */' not in s:
              if '</style>' not in s:
                  raise SystemExit('Could not find style closing tag')
              s = s.replace('</style>', css + '</style>', 1)

          old_n8n = '''<div class="workflow-shot n8n-shot" role="button" tabindex="0" aria-label="Open full n8n workflow image" data-full="n8n-linkedin-ai-workflow.png"><img loading="lazy" decoding="async" src="n8n-linkedin-ai-workflow.png" alt="Advanced n8n workflow"></div>'''
          new_n8n = '''<a class="arch-preview arch-n8n" href="n8n-workflow-explorer.html" aria-label="Open interactive n8n workflow architecture explorer"><div class="arch-preview-head"><span>Interactive architecture · not a screenshot</span><b>71 functional nodes · 73 connections · 7 stages</b></div><svg viewBox="0 0 900 220" aria-hidden="true" preserveAspectRatio="xMidYMid meet"><text class="stage-label" x="54" y="31">ICP</text><text class="stage-label" x="180" y="31">DISCOVERY</text><text class="stage-label" x="320" y="31">ENRICHMENT</text><text class="stage-label" x="454" y="31">RESEARCH</text><text class="stage-label" x="596" y="31">AI SCORE</text><text class="stage-label" x="718" y="31">CONNECT</text><text class="stage-label" x="823" y="31">OUTREACH</text><path class="wire" d="M78 108H172V78H282V108H392V76H510V108H626V78H740V108H835"/><path class="wire faint" d="M282 108V166H392M392 76V44H510M510 108V166H626M626 78V44H740"/><path class="wire faint" d="M172 78V150H228V180H320M392 166H454V188H548M740 108V166H820"/><rect class="box hot" x="48" y="83" rx="8" width="60" height="50"/><rect class="box data" x="158" y="54" rx="8" width="68" height="48"/><rect class="box path" x="266" y="83" rx="8" width="66" height="50"/><rect class="box data" x="374" y="51" rx="8" width="69" height="49"/><rect class="box ai" x="491" y="83" rx="8" width="72" height="50"/><rect class="box ai" x="608" y="54" rx="8" width="70" height="48"/><rect class="box done" x="722" y="83" rx="8" width="66" height="50"/><rect class="box hot" x="813" y="83" rx="8" width="58" height="50"/><rect class="box ai" x="374" y="145" rx="7" width="69" height="42"/><rect class="box ai" x="491" y="145" rx="7" width="72" height="42"/><rect class="box path" x="608" y="145" rx="7" width="70" height="42"/><circle class="beacon" cx="78" cy="108" r="5"/><circle class="dot-node" cx="300" cy="166" r="8"/><circle class="dot-node" cx="528" cy="166" r="8"/><circle class="dot-node" cx="755" cy="166" r="8"/></svg><div class="arch-preview-foot"><span>Follow the full journey from ICP → research → AI scoring → outreach.</span><b>Open interactive explorer ↗</b></div></a>'''
          if old_n8n not in s:
              raise SystemExit('n8n screenshot block not found; refusing unsafe patch')
          s = s.replace(old_n8n, new_n8n, 1)

          zap_flow = '''<div class="flow"><span>Lead</span><b>→</b><span>Qualification</span><b>→</b><span>Paths</span><b>→</b><span>Case logic</span><b>→</b><span>Attorney / team</span></div>'''
          zap_cta = zap_flow + '''<div class="explorer-cta-wrap"><a class="explorer-cta" href="zapier-legal-workflow-explorer.html"><span class="spark">⌁</span><span>Explore the routing architecture ↗</span></a><div class="explorer-note">Zoom, pan and inspect how qualification fans out into separate paths</div></div>'''
          if zap_flow not in s:
              raise SystemExit('Zapier case flow block not found; refusing unsafe patch')
          s = s.replace(zap_flow, zap_cta, 1)

          old_zap = '''<div class="workflow-shot" role="button" tabindex="0" aria-label="Open full Zapier workflow image" data-full="sam-bernstein-zapier-workflow.png"><img loading="lazy" decoding="async" src="sam-bernstein-zapier-workflow.png" alt="Large Zapier workflow"></div>'''
          new_zap = '''<a class="arch-preview arch-zapier" href="zapier-legal-workflow-explorer.html" aria-label="Open interactive Zapier legal lead routing explorer"><div class="arch-preview-head"><span>Interactive routing map · sanitized</span><b>Qualification → paths → branch rules → destinations</b></div><svg viewBox="0 0 660 350" aria-hidden="true" preserveAspectRatio="xMidYMid meet"><text class="stage-label" x="27" y="28">INTAKE</text><text class="stage-label" x="141" y="28">QUALIFY</text><text class="stage-label" x="276" y="28">PATHS</text><text class="stage-label" x="433" y="28">ROUTING</text><text class="stage-label" x="564" y="28">DELIVERY</text><path class="wire" d="M62 176H146M206 176H278"/><path class="wire" d="M338 176H380V70H424M380 176V110H424M380 176V150H424M380 176V200H424M380 176V240H424M380 176V280H424"/><path class="wire" d="M484 70H566M484 110H566M484 150H566M484 200H566M484 240H566M484 280H566"/><path class="wire faint" d="M176 150V88H248M176 202V270H248"/><rect class="box hot" x="30" y="151" width="64" height="50" rx="9"/><rect class="box path" x="144" y="145" width="64" height="62" rx="9"/><rect class="box path hot" x="276" y="145" width="64" height="62" rx="9"/><rect class="box path" x="424" y="51" width="60" height="38" rx="8"/><rect class="box path" x="424" y="91" width="60" height="38" rx="8"/><rect class="box path" x="424" y="131" width="60" height="38" rx="8"/><rect class="box path" x="424" y="181" width="60" height="38" rx="8"/><rect class="box path" x="424" y="221" width="60" height="38" rx="8"/><rect class="box path" x="424" y="261" width="60" height="38" rx="8"/><rect class="box done" x="566" y="51" width="64" height="38" rx="8"/><rect class="box done" x="566" y="91" width="64" height="38" rx="8"/><rect class="box done" x="566" y="131" width="64" height="38" rx="8"/><rect class="box done" x="566" y="181" width="64" height="38" rx="8"/><rect class="box done" x="566" y="221" width="64" height="38" rx="8"/><rect class="box done" x="566" y="261" width="64" height="38" rx="8"/><rect class="box" x="226" y="68" width="70" height="42" rx="8"/><rect class="box" x="226" y="251" width="70" height="42" rx="8"/><circle class="beacon" cx="308" cy="176" r="5"/></svg><div class="arch-preview-foot"><span>Private case labels and recipients are grouped, but the branching decision structure is preserved.</span><b>Explore the paths ↗</b></div></a>'''
          if old_zap not in s:
              raise SystemExit('Zapier screenshot block not found; refusing unsafe patch')
          s = s.replace(old_zap, new_zap, 1)

          p.write_text(s)
          PY

      - name: Validate showcase changes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('index.html').read_text()
          z = Path('zapier-legal-workflow-explorer.html').read_text()
          checks = {
            'n8n explorer link': 'href="n8n-workflow-explorer.html"' in s,
            'zapier explorer link': 'href="zapier-legal-workflow-explorer.html"' in s,
            'n8n screenshot removed from case': 'data-full="n8n-linkedin-ai-workflow.png"' not in s,
            'zapier screenshot removed from case': 'data-full="sam-bernstein-zapier-workflow.png"' not in s,
            'architecture css': 'Interactive architecture previews for advanced case studies' in s,
            'zapier explorer exists': 'Interactive Zapier routing explorer' in z,
            'mobile explorer details': 'mobile-detail' in z,
          }
          bad = [k for k,v in checks.items() if not v]
          print('\n'.join(f"{k}: {'OK' if v else 'FAIL'}" for k,v in checks.items()))
          if bad: raise SystemExit('Validation failed: ' + ', '.join(bad))
          scripts = re.findall(r'<script>(.*?)</script>', z, re.S)
          Path('/tmp/zapier-explorer.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/zapier-explorer.js

      - name: Commit showcase upgrade
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Replace advanced workflow screenshots with interactive previews'
          git push
