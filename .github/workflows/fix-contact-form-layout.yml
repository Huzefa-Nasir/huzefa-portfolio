name: Fix contact form layout
on:
  push:
    paths:
      - '.github/workflows/fix-contact-form-layout.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix form overflow and controls
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          # Keep the modal contained inside the viewport and make its content scroll cleanly.
          s=s.replace(".shell{width:min(900px,100%);max-height:92vh;overflow:auto;border:1px solid #3c383d;border-radius:24px;background:#111113;padding:30px;position:relative}",
                      ".shell{width:min(900px,100%);max-height:calc(100dvh - 44px);overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;border:1px solid #3c383d;border-radius:24px;background:#111113;padding:30px;position:relative;scrollbar-gutter:stable}")

          # Make suggestion chips easier to read and tap.
          s=s.replace(".suggestions{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}",
                      ".suggestions{display:flex;flex-wrap:wrap;gap:8px;margin-top:7px}")
          s=s.replace(".suggestion{border:1px solid #353035;background:#151316;color:#aaa3a0;border-radius:999px;padding:6px 9px;font-size:10px;cursor:pointer;transition:.18s}",
                      ".suggestion{border:1px solid #3a353a;background:#151316;color:#c8c2bf;border-radius:999px;padding:8px 12px;min-height:36px;font-size:12px;line-height:1.15;cursor:pointer;transition:.18s}")

          # Keep the form CTA available without letting it cover fields/chips.
          s=s.replace(".form-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:17px}",
                      ".form-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:22px;padding:14px 0 2px;position:sticky;bottom:-1px;z-index:4;background:linear-gradient(180deg,#11111300 0,#111113 28%,#111113 100%)}")

          # Mobile: preserve scrolling instead of removing the max height, and increase chip readability.
          s=s.replace(".shell{padding:20px 16px;margin:10px 0;max-height:none;border-radius:18px}",
                      ".shell{padding:20px 16px;margin:10px 0;max-height:calc(100dvh - 20px);border-radius:18px}")
          s=s.replace(".suggestion{padding:7px 9px}",
                      ".suggestion{padding:9px 12px;min-height:38px;font-size:12px}")

          # Give the bottom of the brief enough breathing room when scrolled to the end.
          if ".brief.open{display:block;padding-bottom:4px}" not in s:
              s=s.replace(".brief.open{display:block}",".brief.open{display:block;padding-bottom:4px}",1)

          p.write_text(s)
          PY
      - name: Commit form fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix contact form overflow and readability'
          git push
