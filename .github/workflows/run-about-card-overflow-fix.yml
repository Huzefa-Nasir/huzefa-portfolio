name: Run About card overflow fix
on:
  push:
    paths:
      - '.github/workflows/run-about-card-overflow-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 patch_about_card_overflow.py
      - name: Validate
        run: |
          grep -q 'About card overflow final fix' index.html
          grep -q 'position:static!important' index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix About card overflow on desktop and mobile'
          git push
