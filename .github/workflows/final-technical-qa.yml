name: Final technical QA

on:
  push:
    paths:
      - '.github/workflows/final-technical-qa.yml'

permissions:
  contents: write

jobs:
  qa:
    if: github.event.head_commit.message == 'Run final technical QA pass'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply final QA fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          # Make the Smart Brief route a real keyboard-accessible control.
          s=s.replace('<div class="option" id="openBrief">','<button class="option option-button" id="openBrief" type="button">',1)
          s=s.replace('</div><a class="option" target="_blank" rel="noopener noreferrer" href="https://wa.me/923013325345">','</button><a class="option" target="_blank" rel="noopener noreferrer" href="https://wa.me/923013325345">',1)

          # Ensure button version visually inherits the card styling.
          marker='.option{padding:17px;border:1px solid var(--line);border-radius:15px;background:#0c0c0e;cursor:pointer;display:flex;gap:14px;align-items:center;transition:.2s}'
          extra='.option-button{width:100%;color:inherit;text-align:left;font:inherit}.option-button:focus-visible{border-color:#b9ff66}'
          if extra not in s and marker in s:
              s=s.replace(marker,marker+extra,1)

          # Improve lightbox semantics.
          s=s.replace('<img id="lbImg">','<img id="lbImg" alt="Expanded workflow preview">',1)

          # Keep external-link rel values consistent.
          s=s.replace('target="_blank" rel="noopener" href="https://freeacademy.ai/verify/', 'target="_blank" rel="noopener noreferrer" href="https://freeacademy.ai/verify/',1)

          # Better modal focus management: trap Tab inside the active modal.
          trap="""function trapFocus(container,e){if(e.key!=='Tab'||!container.classList.contains('open'))return;const focusable=[...container.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex=\"-1\"])')].filter(x=>x.offsetParent!==null);if(!focusable.length)return;const first=focusable[0],last=focusable[focusable.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}document.addEventListener('keydown',e=>{trapFocus(contactModal,e);trapFocus(lb,e)});"""
          if trap not in s:
              s=s.replace("document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(contactModal.classList.contains('open'))closeContact();if(lb.classList.contains('open'))closeLightbox()}});", "document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(contactModal.classList.contains('open'))closeContact();if(lb.classList.contains('open'))closeLightbox()}});"+trap,1)

          # Avoid stale animation restarts when the tab becomes visible but sections remain off-screen.
          old="document.addEventListener('visibilitychange',()=>{if(document.hidden){setAnimState(heroArt,false);setAnimState(n8nPreview,false)}else{setAnimState(heroArt,true);setAnimState(n8nPreview,true)}});"
          new="document.addEventListener('visibilitychange',()=>{if(document.hidden){setAnimState(heroArt,false);setAnimState(n8nPreview,false)}else{[heroArt,n8nPreview].filter(Boolean).forEach(el=>{const r=el.getBoundingClientRect();setAnimState(el,r.bottom>-120&&r.top<innerHeight+120)})}});"
          s=s.replace(old,new,1)

          p.write_text(s)
          PY

      - name: Static QA checks
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import re, sys

          root=Path('.')
          html=(root/'index.html').read_text()
          explorer=(root/'n8n-workflow-explorer.html').read_text()

          # Confirm internal assets referenced by both pages exist.
          refs=set(re.findall(r'(?:src|href|data-full)=["\']([^"\']+)["\']', html+explorer))
          local=[]
          for ref in refs:
              if ref.startswith(('http://','https://','#','data:','mailto:','tel:')): continue
              ref=ref.split('#')[0].split('?')[0]
              if not ref: continue
              local.append(ref)
          missing=[r for r in sorted(set(local)) if not (root/r).exists()]
          if missing:
              print('Missing internal references:',missing)
              sys.exit(1)

          # Duplicate ID check.
          ids=re.findall(r'\bid=["\']([^"\']+)["\']',html)
          dup=sorted({x for x in ids if ids.count(x)>1})
          if dup:
              print('Duplicate IDs:',dup)
              sys.exit(1)

          # Basic structural sanity.
          required=['<main id="main">','role="dialog"','aria-hidden="true"','n8n-workflow-explorer.html','id="openBrief" type="button"']
          miss=[x for x in required if x not in html]
          if miss:
              print('Required QA markers missing:',miss)
              sys.exit(1)

          print('Static QA passed.')
          print('Internal refs checked:',len(set(local)))
          print('IDs checked:',len(ids))
          PY

      - name: Check public external links
        continue-on-error: true
        run: |
          python - <<'PY'
          import urllib.request, urllib.error
          urls=[
            'https://huzefa-nasir.github.io/huzefa-portfolio/',
            'https://huzefa-nasir.github.io/huzefa-portfolio/n8n-workflow-explorer.html',
            'https://www.linkedin.com/in/huzefa-nasir/',
            'https://www.upwork.com/freelancers/~01ec8a97eba35d40f4',
            'https://calendar.app.google/NnbxV37n93agtP187',
            'https://wa.me/923013325345',
            'https://freeacademy.ai/verify/FA-2026-AAMZ-FQ9SU6'
          ]
          for u in urls:
              req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'},method='GET')
              try:
                  with urllib.request.urlopen(req,timeout=15) as r:
                      print(r.status,u,'->',r.geturl())
              except urllib.error.HTTPError as e:
                  # 401/403/429 often mean bot protection, not a broken human-facing link.
                  print('HTTP',e.code,u)
              except Exception as e:
                  print('CHECK-ERROR',u,type(e).__name__,e)
          PY

      - name: Commit QA fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes required"
          else
            git commit -m "Complete final technical QA fixes"
            git push
          fi
