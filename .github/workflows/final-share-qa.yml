name: Final pre-share portfolio QA

on:
  push:
    paths:
      - '.github/workflows/final-share-qa.yml'

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate portfolio files and privacy
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlparse
          import re, sys

          pages=['index.html','n8n-workflow-explorer.html','zapier-legal-workflow-explorer.html']
          errors=[]

          class P(HTMLParser):
              def __init__(self):
                  super().__init__(); self.ids=[]; self.refs=[]
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs)
                  if 'id' in d:self.ids.append(d['id'])
                  for k in ('href','src'):
                      if k in d:self.refs.append((tag,k,d[k]))

          for page in pages:
              text=Path(page).read_text()
              parser=P(); parser.feed(text)
              seen=set()
              for i in parser.ids:
                  if i in seen: errors.append(f'{page}: duplicate id {i}')
                  seen.add(i)
              for tag,k,ref in parser.refs:
                  if not ref or ref.startswith(('#','http://','https://','data:','mailto:','tel:','javascript:')): continue
                  path=ref.split('#',1)[0].split('?',1)[0]
                  if path and not Path(path).exists(): errors.append(f'{page}: missing local reference {ref}')
              scripts=re.findall(r'<script>(.*?)</script>',text,re.S)
              for j,script in enumerate(scripts):
                  Path(f'/tmp/{page}.{j}.js').write_text(script)

          alltext='\n'.join(Path(x).read_text() for x in pages)
          banned=['Sam Bernstein','sam-bernstein-zapier-workflow.png']
          for x in banned:
              if x.lower() in alltext.lower(): errors.append(f'privacy: banned reference remains: {x}')
          if Path('sam-bernstein-zapier-workflow.png').exists(): errors.append('privacy: restricted screenshot still exists')
          if 'FA-2026-AAMZ-F09SU6' not in Path('index.html').read_text(): errors.append('certificate: correct credential URL missing')
          if 'zapier-legal-workflow-explorer.html' not in Path('index.html').read_text(): errors.append('work: Zapier explorer link missing')
          if 'n8n-workflow-explorer.html' not in Path('index.html').read_text(): errors.append('work: n8n explorer link missing')
          if '.route-icon{background:#f7f3ee!important' not in Path('index.html').read_text(): errors.append('theme: bright contact icon tiles missing')
          if '.node{color:var(--text);position:absolute' not in Path('zapier-legal-workflow-explorer.html').read_text(): errors.append('theme: Zapier node contrast fix missing')
          if errors:
              print('\n'.join('FAIL '+e for e in errors)); sys.exit(1)
          print('PASS: local references resolve')
          print('PASS: no duplicate IDs')
          print('PASS: restricted client name/screenshot absent from current site')
          print('PASS: certificate link correct')
          print('PASS: both interactive workflow explorers linked')
          print('PASS: dark-theme contrast/logo fixes present')
          PY
      - name: Validate inline JavaScript syntax
        run: |
          for f in /tmp/*.js; do node --check "$f"; done
      - name: Confirm repository cleanup
        run: |
          test ! -e automation-confirmation-workflow.png
          test ! -e sam-bernstein-zapier-workflow.png
          echo 'PASS: unused/restricted image assets removed'
