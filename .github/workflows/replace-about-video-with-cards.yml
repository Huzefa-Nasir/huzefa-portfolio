name: Replace About video with animated cards
on:
  push:
    paths:
      - '.github/workflows/replace-about-video-with-cards.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace film with premium animated cards
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          start=s.find('/* Premium About motion film */')
          end=s.find('</style>', start)
          if start==-1 or end==-1:
              raise SystemExit('About film CSS block not found')
          css='''/* Premium About builder cards */
.about-live{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-self:center}.about-card{position:relative;min-height:170px;padding:20px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,#171619,#111012);overflow:hidden;box-shadow:0 16px 42px #0003;transition:.2s}.about-card:before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 15% 10%,#ff4f000d,transparent 36%);pointer-events:none}.about-card:hover{border-color:#4b444a;transform:translateY(-2px)}.about-card-k{position:relative;z-index:2;font:700 9px 'Space Grotesk';text-transform:uppercase;letter-spacing:.13em;color:#777}.about-card strong{position:relative;z-index:2;display:block;margin-top:8px;font:700 26px/1 'Space Grotesk';letter-spacing:-.035em}.about-card small{position:relative;z-index:2;display:block;margin-top:6px;color:#a69f9b;font-size:11px}.count-card strong{font-size:42px}.count-line{position:absolute;left:20px;right:20px;bottom:22px;height:26px}.count-line:before{content:'';position:absolute;left:0;right:0;top:12px;height:1px;background:#3b363b}.count-line:after{content:'';position:absolute;left:0;top:10px;width:7px;height:7px;border-radius:50%;background:var(--o);box-shadow:0 0 13px #ff4f00;animation:aboutTravel 4s ease-in-out infinite}.node-mini{position:absolute;left:20px;right:20px;bottom:20px;height:38px;display:flex;align-items:center;justify-content:space-between}.node-mini:before{content:'';position:absolute;left:13px;right:13px;top:18px;height:2px;background:#413b41}.node-mini i{position:relative;z-index:2;width:27px;height:27px;border-radius:8px;border:1px solid #534c54;background:#131215;display:grid;place-items:center;font-style:normal;font:700 7px 'Space Grotesk';color:#ddd}.node-mini i:nth-child(1){border-color:#ff4f00}.node-mini i:nth-child(2){border-color:#8d6cff}.node-mini i:nth-child(3){border-color:#31b994}.node-mini i:nth-child(4){border-color:#7ccf46}.node-mini .mini-packet{position:absolute;z-index:3;left:10px;top:14px;width:8px;height:8px;border-radius:50%;background:var(--o);box-shadow:0 0 10px #ff4f00;animation:nodeTravel 4.8s linear infinite}.api-console{position:absolute;left:20px;right:20px;bottom:18px;border:1px solid #2f2b30;border-radius:11px;background:#0b0b0d;padding:10px 11px;font:600 9px/1.65 'Space Grotesk';color:#8f8884}.api-console b{color:#ff7a47}.api-console em{font-style:normal;color:var(--g)}.api-caret{display:inline-block;width:5px;height:10px;margin-left:3px;background:var(--g);vertical-align:-1px;animation:caretBlink 1s steps(1) infinite}.crm-row{position:absolute;left:20px;right:20px;bottom:20px;display:flex;gap:8px;flex-wrap:wrap}.crm-pill{height:31px;padding:0 9px;border:1px solid #353036;border-radius:9px;background:#0d0c0f;display:flex;align-items:center;gap:6px;font-size:9px;color:#d0cac7}.crm-pill img{width:16px;height:16px;object-fit:contain;filter:brightness(1.1)}.about-role-strip{grid-column:1/-1;position:relative;margin-top:2px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:#111012;overflow:hidden;display:flex;justify-content:space-between;gap:10px}.about-role-strip:before{content:'';position:absolute;left:18px;right:18px;top:50%;height:1px;background:#302b30}.about-role-strip:after{content:'';position:absolute;left:18px;top:calc(50% - 4px);width:8px;height:8px;border-radius:50%;background:var(--o);box-shadow:0 0 12px #ff4f00;animation:roleTravel 7s ease-in-out infinite}.about-role-strip span{position:relative;z-index:2;background:#111012;padding:0 6px;font:700 8px 'Space Grotesk';letter-spacing:.08em;color:#aaa3a0;text-transform:uppercase}.about-card.in .count-num{animation:countPop .55s ease-out both}.about-card.in .node-mini i{animation:nodePop .45s ease-out both}.about-card.in .node-mini i:nth-child(2){animation-delay:.06s}.about-card.in .node-mini i:nth-child(3){animation-delay:.12s}.about-card.in .node-mini i:nth-child(4){animation-delay:.18s}@keyframes aboutTravel{0%,8%{left:0;opacity:.25}45%{opacity:1}92%,100%{left:calc(100% - 7px);opacity:.35}}@keyframes nodeTravel{0%{left:10px;opacity:.15}12%{opacity:1}88%{opacity:1}100%{left:calc(100% - 18px);opacity:.2}}@keyframes roleTravel{0%,8%{left:18px}92%,100%{left:calc(100% - 26px)}}@keyframes caretBlink{50%{opacity:0}}@keyframes countPop{from{transform:translateY(10px);opacity:.2}to{transform:none;opacity:1}}@keyframes nodePop{from{transform:scale(.72);opacity:.25}to{transform:none;opacity:1}}
@media(max-width:850px){.about-live{margin-top:4px}.about-card{min-height:155px}}
@media(max-width:550px){.about-live{grid-template-columns:1fr;gap:10px}.about-card{min-height:145px;padding:18px}.about-card strong{font-size:24px}.count-card strong{font-size:38px}.about-role-strip{grid-column:auto;overflow:auto;justify-content:flex-start;white-space:nowrap}.about-role-strip span{flex:none}.crm-row{bottom:16px}.api-console{bottom:15px}}
@media(prefers-reduced-motion:reduce){.count-line:after,.node-mini .mini-packet,.api-caret,.about-role-strip:after,.about-card.in .count-num,.about-card.in .node-mini i{animation:none!important}}\n'''
          s=s[:start]+css+s[end:]

          old='''<div class="about-film-shell reveal-scale"><div class="about-film-top"><span>2024 → 2026</span><b>Automation story · 13 sec</b></div><div class="about-film-stage"><div class="about-film-fallback"><strong>100+</strong><span>AUTOMATIONS BUILT</span></div><video id="aboutFilm" muted loop playsinline autoplay preload="none" aria-label="Animated story showing Huzefa's automation work growing from one workflow to more than one hundred"><source data-src="about-automation-story.mp4" type="video/mp4"></video><div class="about-film-badge"><i></i><span>Built as a motion piece — not a stock reel</span></div></div><div class="about-film-foot"><span>From one trigger to 100+ automations.</span><strong>Build · debug · automate</strong></div></div>'''
          new='''<div class="about-live"><article class="about-card count-card reveal-scale"><div class="about-card-k">Built in production</div><strong class="count-num">100+</strong><small>automations & workflows shipped</small><div class="count-line" aria-hidden="true"></div></article><article class="about-card reveal-scale" data-delay="1"><div class="about-card-k">Advanced automation</div><strong>Zapier + n8n</strong><small>Paths, loops, AI decisions and routing logic.</small><div class="node-mini" aria-hidden="true"><i>TRG</i><i>IF</i><i>AI</i><i>CRM</i><b class="mini-packet"></b></div></article><article class="about-card reveal-scale" data-delay="2"><div class="about-card-k">Custom integrations</div><strong>APIs + Webhooks</strong><small>When native connectors stop being enough.</small><div class="api-console" aria-hidden="true"><b>POST</b> /lead<br><span>auth → transform → CRM</span><br><em>200 OK ✓</em><i class="api-caret"></i></div></article><article class="about-card reveal-scale" data-delay="3"><div class="about-card-k">CRM ecosystem</div><strong>Broad experience</strong><small>Connecting the tools businesses already depend on.</small><div class="crm-row"><span class="crm-pill"><img loading="lazy" src="https://api.iconify.design/logos:hubspot.svg" alt="">HubSpot</span><span class="crm-pill"><img loading="lazy" src="https://api.iconify.design/logos:salesforce.svg" alt="">Salesforce</span><span class="crm-pill"><img loading="lazy" src="https://api.iconify.design/logos:pipedrive.svg" alt="">Pipedrive</span></div></article><div class="about-role-strip reveal" data-delay="4"><span>Support engineer</span><span>Automation builder</span><span>API integrator</span><span>Problem solver</span></div></div>'''
          if old not in s:
              raise SystemExit('About video HTML not found')
          s=s.replace(old,new,1)

          s=s.replace("markReveal('#about .about-film-shell','reveal-scale');","markReveal('#about .about-card','reveal-scale',true);markReveal('#about .about-role-strip','reveal');")

          js_start=s.find("const aboutFilm=document.getElementById('aboutFilm');")
          js_end=s.find(";const heroArt=document.querySelector('.hero-art')", js_start)
          if js_start!=-1 and js_end!=-1:
              s=s[:js_start]+s[js_end+1:]
          elif 'aboutFilm' in s:
              raise SystemExit('Could not safely remove About film JS')

          p.write_text(s)
          PY
      - name: Validate page
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          required=['about-live','count-card','node-mini','api-console','crm-row','about-role-strip','100+','Zapier + n8n','APIs + Webhooks']
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('Missing: '+repr(missing))
          forbidden=['aboutFilm','about-film-shell','about-automation-story.mp4']
          left=[x for x in forbidden if x in s]
          if left: raise SystemExit('Old video references remain: '+repr(left))
          Path('/tmp/index.js').write_text('\n'.join(re.findall(r'<script>(.*?)</script>',s,re.S)))
          print('About cards checks: OK')
          PY
          node --check /tmp/index.js
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Replace About video with animated builder cards'
          git push
