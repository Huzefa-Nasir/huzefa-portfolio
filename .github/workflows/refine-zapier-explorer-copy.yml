name: Refine Zapier explorer public copy

on:
  push:
    paths:
      - '.github/workflows/refine-zapier-explorer-copy.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make grouped architecture wording precise
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('zapier-legal-workflow-explorer.html')
          s=p.read_text()
          replacements={
            'This public explorer shows the architecture of the Sam Bernstein lead-routing Zap without exposing private case labels, recipient details or client data.':'This public explorer is a grouped representation of the Sam Bernstein lead-routing Zap, showing the decision architecture without exposing private case labels, recipient details or client data.',
            "name:'Normalize lead fields',sub:'Prepare values for rules',icon:'TXT',type:'Formatter / data prep',desc:'Standardizes the incoming lead data so later filters and paths evaluate consistent values.'":"name:'Lead intake / field prep',sub:'Grouped preparation steps',icon:'TXT',type:'Public grouping',desc:'Groups the small preparation steps that get incoming lead data ready for the routing logic. Exact private implementation details are intentionally hidden.'",
            "name:'Required data check',sub:'Can this lead be evaluated?',icon:'IF',type:'Filter',desc:'Checks that the lead contains enough information to continue through the routing logic.'":"name:'Qualification layer',sub:'Grouped preliminary conditions',icon:'IF',type:'Grouped qualification',desc:'Represents the preliminary conditions used before a lead reaches the main case-routing paths. Multiple private checks are grouped in this public view.'",
            "name:'Case route 01',sub:'Anonymized case category'":"name:'Case branch group 01',sub:'Anonymized route group'",
            "name:'Case route 02',sub:'Anonymized case category'":"name:'Case branch group 02',sub:'Anonymized route group'",
            "name:'Case route 03',sub:'Anonymized case category'":"name:'Case branch group 03',sub:'Anonymized route group'",
            "name:'Case route 04',sub:'Anonymized case category'":"name:'Case branch group 04',sub:'Anonymized route group'",
            "name:'Case route 05',sub:'Anonymized case category'":"name:'Case branch group 05',sub:'Anonymized route group'",
            "name:'Case route 06',sub:'Anonymized case category'":"name:'Case branch group 06',sub:'Anonymized route group'",
            "name:'Case route 07',sub:'Anonymized case category'":"name:'Case branch group 07',sub:'Anonymized route group'",
            "desc:'One of the case-specific branches in the original Zap. Public case labels are hidden.'":"desc:'A public grouping of case-specific conditions from the original Zap. Private case labels are hidden.'",
            "name:'Other / review route',sub:'Catch cases outside primary paths'":"name:'Additional case route',sub:'Grouped secondary routing'",
            "name:'Fallback review',sub:'Keep unmatched leads visible'":"name:'Additional branch rules',sub:'Grouped secondary conditions'",
            "name:'Manual review queue',sub:'Safe fallback destination'":"name:'Additional destination',sub:'Grouped downstream handling'"
          }
          misses=[]
          for old,new in replacements.items():
            if old in s:s=s.replace(old,new,1)
            elif new not in s:misses.append(old[:55])
          if misses:raise SystemExit('Expected copy not found: '+repr(misses))
          p.write_text(s)
          PY
      - name: Validate explorer
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('zapier-legal-workflow-explorer.html').read_text()
          required=['grouped representation','Lead intake / field prep','Qualification layer','Case branch group 01','Additional case route','Additional branch rules','Additional destination','const activePointers=new Map()']
          missing=[x for x in required if x not in s]
          if missing:raise SystemExit('Missing '+repr(missing))
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          Path('/tmp/zapier.js').write_text('\n'.join(scripts))
          print('copy + mobile interaction checks: OK')
          PY
          node --check /tmp/zapier.js
      - name: Commit refined explorer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add zapier-legal-workflow-explorer.html
          git commit -m 'Refine Zapier explorer public architecture copy'
          git push
