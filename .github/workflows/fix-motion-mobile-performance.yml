name: Fix workflow motion and mobile performance

on:
  push:
    paths:
      - '.github/workflows/fix-motion-mobile-performance.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch main portfolio motion and performance
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          # Non-blocking Google font CSS: keep the same typography but don't block first paint.
          old='<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">'
          new='<link rel="preload" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" as="style" onload="this.onload=null;this.rel=\'stylesheet\'"><noscript><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"></noscript>'
          if old in s:
              s=s.replace(old,new,1)

          # Give both architecture previews real moving data packets.
          old='<circle class="beacon" cx="78" cy="108" r="5"/><circle class="dot-node" cx="300" cy="166" r="8"/>'
          new='''<circle class="beacon start-beacon" cx="78" cy="108" r="4"/><circle class="route-packet n8n-packet" r="5"><animateMotion dur="7.2s" repeatCount="indefinite" path="M78 108 H172 V78 H282 V108 H392 V76 H510 V108 H626 V78 H740 V108 H835"/></circle><circle class="dot-node" cx="300" cy="166" r="8"/>'''
          if old not in s and 'class="route-packet n8n-packet"' not in s:
              raise SystemExit('n8n packet insertion point missing')
          s=s.replace(old,new,1)

          old='<circle class="beacon" cx="308" cy="176" r="5"/></svg>'
          new='''<circle class="beacon start-beacon" cx="308" cy="176" r="4"/><circle class="route-packet zap-packet" r="5"><animateMotion dur="5.2s" begin="0s" repeatCount="indefinite" path="M62 176 H176 H308 H380 V70 H454 H598"/></circle><circle class="route-packet zap-packet p-alt" r="5"><animateMotion dur="5.8s" begin="1.35s" repeatCount="indefinite" path="M62 176 H176 H308 H380 V150 H454 H598"/></circle><circle class="route-packet zap-packet p-alt2" r="5"><animateMotion dur="6.4s" begin="2.7s" repeatCount="indefinite" path="M62 176 H176 H308 H380 V280 H454 H598"/></circle></svg>'''
          if old not in s and 'class="route-packet zap-packet"' not in s:
              raise SystemExit('Zapier packet insertion point missing')
          s=s.replace(old,new,1)

          # Defer the large integration-logo wall until it is close to the viewport.
          old="const logos=document.getElementById('logos');[...APPS,...APPS].forEach(a=>logos.appendChild(logo(a)));const lb="
          new="""const logos=document.getElementById('logos');let logosReady=false;function hydrateLogos(){if(logosReady)return;logosReady=true;[...APPS,...APPS].forEach(a=>logos.appendChild(logo(a)))}if('IntersectionObserver'in window){const logoObserver=new IntersectionObserver(entries=>{if(entries.some(e=>e.isIntersecting)){hydrateLogos();logoObserver.disconnect()}},{rootMargin:'500px 0px'});logoObserver.observe(document.querySelector('.logo-marquee'))}else{hydrateLogos()}const lb="""
          if old not in s and 'function hydrateLogos()' not in s:
              raise SystemExit('logo hydration insertion point missing')
          s=s.replace(old,new,1)

          # Simplify animation observer; the old n8n-shot target no longer exists.
          old="const heroArt=document.querySelector('.hero-art'),n8nPreview=document.querySelector('.n8n-shot');const setAnimState=(el,on)=>{if(!el)return;el.querySelectorAll('*').forEach(x=>x.style.animationPlayState=on?'running':'paused')};if('IntersectionObserver'in window){const animObserver=new IntersectionObserver(entries=>entries.forEach(e=>setAnimState(e.target,e.isIntersecting&&!document.hidden)),{rootMargin:'120px'});[heroArt,n8nPreview].filter(Boolean).forEach(el=>animObserver.observe(el))}document.addEventListener('visibilitychange',()=>{if(document.hidden){setAnimState(heroArt,false);setAnimState(n8nPreview,false)}else{[heroArt,n8nPreview].filter(Boolean).forEach(el=>{const r=el.getBoundingClientRect();setAnimState(el,r.bottom>-120&&r.top<innerHeight+120)})}});"
          new="""const heroArt=document.querySelector('.hero-art');const setAnimState=(el,on)=>{if(!el)return;el.querySelectorAll('[class]').forEach(x=>{if(getComputedStyle(x).animationName!=='none')x.style.animationPlayState=on?'running':'paused'})};if('IntersectionObserver'in window&&heroArt){const animObserver=new IntersectionObserver(entries=>entries.forEach(e=>setAnimState(e.target,e.isIntersecting&&!document.hidden)),{rootMargin:'80px'});animObserver.observe(heroArt)}if(heroArt&&!matchMedia('(prefers-reduced-motion: reduce)').matches){requestAnimationFrame(()=>setAnimState(heroArt,true))}document.addEventListener('visibilitychange',()=>{if(!heroArt)return;if(document.hidden){setAnimState(heroArt,false)}else{const r=heroArt.getBoundingClientRect();setAnimState(heroArt,r.bottom>-80&&r.top<innerHeight+80)}});"""
          if old in s:
              s=s.replace(old,new,1)
          elif 'n8nPreview=document.querySelector' in s:
              raise SystemExit('animation observer changed unexpectedly')

          css=r'''
/* Motion quality + mobile performance pass */
.arch-preview .route-packet{fill:#ff4f00;filter:drop-shadow(0 0 8px #ff4f00);pointer-events:none}.arch-preview .start-beacon{opacity:.55;animation:archPulse 2.4s ease-in-out infinite}.arch-preview .p-alt{opacity:.88}.arch-preview .p-alt2{opacity:.76}
#integrations,#process,#about,footer{content-visibility:auto;contain-intrinsic-size:1px 720px}
.logo-track{transform:translateZ(0);will-change:transform}
@media(max-width:550px){
  nav{backdrop-filter:none;-webkit-backdrop-filter:none;background:#0b0b0cf7}
  .hero-art{contain:paint;box-shadow:0 18px 42px #0005}
  .hero-art:before{background-size:40px 40px;opacity:.7}
  .camera{animation:none!important;transform:none!important}
  .wh,.data,.ai,.path,.crm,.cal{animation:none!important}
  .node{box-shadow:0 7px 18px #0005}
  .packet{box-shadow:0 0 8px #ff4f00;will-change:left,top,opacity}
  .p1{animation:p1Mobile 10s linear infinite!important}.p2{animation:p2Mobile 10s linear infinite!important}.p3{animation:p3Mobile 10s linear infinite!important}.p4{animation:p4Mobile 10s linear infinite!important}.p5{animation:p5Mobile 10s linear infinite!important}
  .success{box-shadow:0 12px 30px #0007}
  .arch-preview .wire,.arch-preview .route-packet{filter:none}
  .arch-preview:hover{transform:none;box-shadow:inset 0 1px #ffffff08}
}
@keyframes p1Mobile{0%,5%,18%,100%{opacity:0}6%{opacity:1;left:14%;top:18%}17%{opacity:1;left:42%;top:18%}}
@keyframes p2Mobile{0%,20%,35%,100%{opacity:0}21%{opacity:1;left:42%;top:18%}34%{opacity:1;left:28%;top:50%}}
@keyframes p3Mobile{0%,38%,53%,100%{opacity:0}39%{opacity:1;left:28%;top:50%}52%{opacity:1;left:57%;top:50%}}
@keyframes p4Mobile{0%,56%,70%,100%{opacity:0}57%{opacity:1;left:57%;top:50%}69%{opacity:1;left:84%;top:50%}}
@keyframes p5Mobile{0%,73%,88%,100%{opacity:0}74%{opacity:1;left:84%;top:50%}87%{opacity:1;left:84%;top:80%}}
@media(prefers-reduced-motion:reduce) and (max-width:550px){.p1,.p2,.p3,.p4,.p5{animation:none!important}.arch-preview .route-packet{display:none}.arch-preview .start-beacon{animation:none!important}}
'''
          if '/* Motion quality + mobile performance pass */' not in s:
              s=s.replace('</style>',css+'</style>',1)

          p.write_text(s)
          PY
      - name: Validate patched page
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          required=['route-packet n8n-packet','route-packet zap-packet','p1Mobile','function hydrateLogos()','content-visibility:auto','camera{animation:none!important','requestAnimationFrame(()=>setAnimState(heroArt,true))']
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('Missing: '+repr(missing))
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          Path('/tmp/main-inline.js').write_text('\n'.join(scripts))
          print('main page motion/performance checks OK')
          PY
          node --check /tmp/main-inline.js
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix workflow motion and optimize mobile rendering'
          git push
