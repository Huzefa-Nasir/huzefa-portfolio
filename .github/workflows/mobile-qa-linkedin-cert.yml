name: Mobile QA LinkedIn and certification

on:
  push:
    paths:
      - '.github/workflows/mobile-qa-linkedin-cert.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run mobile QA LinkedIn certification pass'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply mobile QA, LinkedIn contact, and certification proof
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          # Keep marquee moving on touch devices; pause only with real mouse hover.
          s=s.replace('.logo-track:hover{animation-play-state:paused}', '@media(hover:hover) and (pointer:fine){.logo-track:hover{animation-play-state:paused}}', 1)

          # Add LinkedIn contact route after Upwork.
          upwork='''<a class="option" target="_blank" href="https://www.upwork.com/freelancers/~01ec8a97eba35d40f4"><div class="route-icon up-icon"><img src="https://api.iconify.design/logos:upwork.svg" alt="Upwork" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'"><span class="route-fallback">UP</span></div><div class="option-copy"><b>Upwork</b><span>Hire through the marketplace</span></div></a>'''
          linkedin='''<a class="option" target="_blank" href="https://www.linkedin.com/in/huzefa-nasir/"><div class="route-icon li-icon"><img src="https://api.iconify.design/logos:linkedin-icon.svg" alt="LinkedIn" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'"><span class="route-fallback">IN</span></div><div class="option-copy"><b>LinkedIn</b><span>Connect or message me directly</span></div></a>'''
          if linkedin not in s and upwork in s:
              s=s.replace(upwork, upwork+linkedin, 1)

          # LinkedIn tile styling.
          s=s.replace('.up-icon{background:#111811}', '.up-icon{background:#111811}.li-icon{background:#0d1620}', 1)

          # Add certification proof to About.
          old_buttons='''<div class="buttons"><a class="btn secondary" target="_blank" href="https://www.linkedin.com/in/huzefa-nasir/">LinkedIn ↗</a><a class="btn secondary" target="_blank" href="https://www.upwork.com/freelancers/~01ec8a97eba35d40f4">Upwork ↗</a></div>'''
          cert='''<div class="cert-proof"><div class="cert-mark">✓</div><div><strong>AI Automations · Make · Zapier</strong><span>FreeAcademy.ai · Verified credential · 2026</span></div><a target="_blank" rel="noopener" href="https://freeacademy.ai/verify/FA-2026-AAMZ-FQ9SU6">Verify ↗</a></div>'''
          if cert not in s and old_buttons in s:
              s=s.replace(old_buttons, old_buttons+cert, 1)

          # Certification styling.
          marker='.mini span{font-size:12px;color:var(--muted)}'
          cert_css='''.cert-proof{margin-top:22px;display:flex;align-items:center;gap:12px;padding:14px 15px;border:1px solid var(--line);border-radius:14px;background:#111012}.cert-mark{width:34px;height:34px;flex:0 0 34px;border-radius:10px;display:grid;place-items:center;background:#b9ff6614;color:var(--g);font-weight:900;border:1px solid #b9ff6630}.cert-proof strong{display:block;font:700 13px 'Space Grotesk'}.cert-proof span{display:block;color:var(--muted);font-size:10px}.cert-proof a{margin-left:auto;color:var(--o);font-size:11px;font-weight:700;white-space:nowrap}'''
          if cert_css not in s and marker in s:
              s=s.replace(marker, marker+cert_css, 1)

          # Mobile QA refinements.
          mobile_marker='@media(max-width:550px){'
          mobile_css='''@media(max-width:550px){nav .wrap{width:calc(100% - 24px)}.nav{height:64px}.nav>.btn{padding:10px 13px;font-size:12px;border-radius:9px}.brand{font-size:17px}section{padding:68px 0}.head{gap:12px;margin-bottom:26px}.head h2,.about h2{font-size:34px;line-height:1.02}.head p{font-size:14px;margin-top:0}.case{border-radius:17px}.case h3{font-size:24px}.flow{gap:5px;margin-top:17px}.flow span{font-size:10px;padding:6px 8px}.support-copy{padding:20px 18px 15px}.support-shot{height:190px;margin:0 10px 10px}.logo-card{width:128px;height:108px}.logo-card img{width:42px;height:42px}.logo-track{gap:10px;padding:6px}.note{font-size:13px;padding:18px;margin-top:18px}.about{gap:28px}.cert-proof{align-items:flex-start;flex-wrap:wrap}.cert-proof a{margin-left:46px}.modal{padding:10px;align-items:flex-start;overflow-y:auto}.shell{padding:20px 16px;margin:10px 0;max-height:none;border-radius:18px}.contactgrid{gap:8px}.option{padding:12px 11px;gap:10px}.route-icon{width:38px;height:38px;flex-basis:38px}.route-icon img{width:24px;height:24px}.option-copy b{font-size:12px}.option-copy span{font-size:9px}.close{right:12px;top:12px;width:34px;height:34px}.brief-head h2{font-size:25px}.form-actions .btn{width:100%}.privacy-note{width:100%;text-align:center}.cta p{font-size:14px}.social{flex-wrap:wrap;gap:12px 16px}footer{gap:12px}}'''
          if mobile_css not in s:
              s=s.replace(mobile_marker, mobile_css+mobile_marker, 1)

          p.write_text(s)
          PY
      - name: Commit improvements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Polish mobile UX and add LinkedIn contact and certification"
          git push
